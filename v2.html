<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3f6fc4" />
    <title>Galami Labs v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scrub">
      <div class="pin">
        <img
          src="Final First Frame.jpg"
          alt="A boy holding a ruler up to the sky"
          fetchpriority="high"
          decoding="sync"
          draggable="false"
        />
        <video
          class="hero-video"
          muted
          playsinline
          webkit-playsinline
          preload="none"
          disablepictureinpicture
          disableremoteplayback
          poster="Final First Frame.jpg"
          data-scrub="scrub-v2.mp4"
        ></video>
        <img
          class="end-still"
          src="Final Middle Frame.jpg"
          alt="A boy standing in a meadow, looking at the mountains"
          draggable="false"
          aria-hidden="true"
        />
        <h1 class="wordmark">Galami Labs</h1>
        <button type="button" class="next">
          <span>Scroll to next</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </main>
    <script src="scrub.js"></script>
  </body>
</html>
