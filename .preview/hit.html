<!DOCTYPE html>
<html>
  <body>
    <iframe id="f" src="/index.html" style="width:1600px;height:1000px;border:0"></iframe>
    <pre id="out"></pre>
    <script>
      const frame = document.getElementById("f");
      frame.addEventListener("load", async () => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const still = doc.querySelector(".end-still");
        if (!still.complete) await new Promise((resolve) => still.addEventListener("load", resolve, { once: true }));
        await new Promise((resolve) => setTimeout(resolve, 400));
        doc.querySelector(".pin").classList.add("is-end", "is-away");
        const samples = win.eval(`(() => {
          const buttons = [...document.querySelectorAll(".summit")];
          return buttons.map((button) => {
            const box = button.getBoundingClientRect();
            const mid = document.elementFromPoint(box.left + box.width / 2, box.top + box.height * 0.55);
            const outside = document.elementFromPoint(box.left + 3, box.top + 3);
            return {
              label: button.getAttribute("aria-label"),
              mid: mid ? mid.className || mid.tagName : null,
              outside: outside ? outside.className || outside.tagName : null,
              box: [Math.round(box.width), Math.round(box.height)],
              clip: button.style.clipPath,
            };
          });
        })()`);
        document.getElementById("out").textContent = JSON.stringify(samples, null, 2);
      });
    </script>
  </body>
</html>
