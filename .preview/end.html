<!DOCTYPE html>
<html>
  <head>
    <style>
      html, body { margin: 0; height: 100%; background: #3f6fc4; }
      iframe { width: 100vw; height: 100vh; border: 0; }
    </style>
  </head>
  <body>
    <iframe id="f" src="/index.html"></iframe>
    <script>
      const frame = document.getElementById("f");
      frame.addEventListener("load", () => {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const still = doc.querySelector(".end-still");
        const go = () => {
          win.scrollTo(0, 100000);
          doc.documentElement.dataset.ready = doc.querySelector(".replay").hidden ? "hidden" : "shown";
        };
        if (still.complete) setTimeout(go, 300);
        else still.addEventListener("load", () => setTimeout(go, 300), { once: true });
      });
    </script>
  </body>
</html>
