<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#3f6fc4" />
    <title>Loading — Galami Labs</title>
    <link rel="preload" as="image" href="../Mobile%20First%20Frame.jpg" media="(max-aspect-ratio: 4/5)" />
    <link rel="preload" as="image" href="../trial-first.jpg" media="(min-aspect-ratio: 4/5)" />
    <script>
      (function () {
        var names = { focus: 1, sky: 1, ruler: 1, altitude: 1, peaks: 1, sketch: 1, scale: 1 };
        var v = new URLSearchParams(location.search).get("v");
        document.documentElement.dataset.screen = names[v] ? v : "focus";
      })();
    </script>
    <style>
      :root {
        --sky: #3f6fc4;
        --p: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--sky);
        color: #fff;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .lab {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        background: var(--sky);
        user-select: none;
      }

      .still {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        transform-origin: center center;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      html[data-screen="focus"]:not(.is-open) .still {
        filter: blur(calc((1 - var(--p)) * 20px));
        transform: scale(calc(1 + (1 - var(--p)) * 0.08));
      }

      .cover {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: var(--sky);
        opacity: 1;
        transition: opacity 0.8s ease;
      }

      html[data-screen="focus"] .cover,
      html.is-open .cover {
        opacity: 0;
      }

      html:not(.is-open) .cover {
        transition: none;
      }

      .home-lock {
        position: absolute;
        z-index: 4;
        top: 14vh;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        pointer-events: none;
        opacity: 1;
        transform: none;
      }

      html.is-open .home-lock {
        transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s ease;
      }

      html:not(.is-open) .home-lock {
        transition: none;
      }

      html[data-screen="sky"]:not(.is-open) .home-lock {
        transform: translateY(calc(50dvh - 14vh - 2.2rem));
      }

      html[data-screen="altitude"]:not(.is-open) .home-lock,
      html[data-screen="sketch"]:not(.is-open) .home-lock,
      html[data-screen="scale"]:not(.is-open) .home-lock {
        opacity: 0;
      }

      .home-mark {
        margin: 0;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-weight: 500;
        font-size: clamp(4.2rem, 10.5vw, 9.5rem);
        line-height: 0.95;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }

      .title-rule {
        display: none;
        width: min(34vw, 9.5rem);
        height: 1px;
        margin: 1.2rem auto 0;
        background: rgba(255, 255, 255, 0.28);
        opacity: 1;
        transition: opacity 0.45s ease;
      }

      html[data-screen="focus"] .title-rule,
      html[data-screen="sky"] .title-rule {
        display: block;
      }

      html.is-open .title-rule {
        opacity: 0;
      }

      html:not(.is-open) .title-rule {
        transition: none;
      }

      .title-rule span {
        display: block;
        height: 100%;
        width: calc(var(--p) * 100%);
        background: #fff;
      }

      .instrument {
        z-index: 3;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.75s ease;
      }

      html.is-open .instrument {
        opacity: 0;
      }

      html:not(.is-open) .instrument {
        transition: none;
      }

      .instrument-ruler,
      .instrument-altitude,
      .instrument-peaks,
      .instrument-sketch,
      .instrument-scale {
        display: none;
      }

      html[data-screen="ruler"] .instrument-ruler {
        display: block;
      }

      html[data-screen="altitude"] .instrument-altitude {
        display: flex;
      }

      html[data-screen="peaks"] .instrument-peaks {
        display: block;
      }

      html[data-screen="sketch"] .instrument-sketch,
      html[data-screen="scale"] .instrument-scale {
        display: flex;
      }

      .instrument-ruler {
        position: absolute;
        left: 50%;
        top: 44%;
        width: min(74vw, 34rem);
        transform: translate(-50%, -50%);
      }

      .ruler-ticks {
        height: 0.95rem;
        background:
          repeating-linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px 12.5%) left bottom / 100% 100% no-repeat,
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.72) 0 1px, transparent 1px 3.125%) left bottom / 100% 42% no-repeat;
      }

      .ruler-base {
        height: 1.5px;
        background: rgba(255, 255, 255, 0.32);
      }

      .ruler-base span {
        display: block;
        position: relative;
        height: 100%;
        width: calc(var(--p) * 100%);
        background: #fff;
      }

      .ruler-base span::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: -0.2rem;
        width: 1.5px;
        height: 1.25rem;
        background: #fff;
        transform: translateX(50%);
      }

      .instrument-altitude {
        position: absolute;
        inset: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 6vh;
        text-align: center;
      }

      .alt-name,
      .alt-note,
      .alt-figure,
      .summit-name,
      .summit-height,
      .dock-name,
      .dock-blurb {
        font-family: system-ui, sans-serif;
      }

      .alt-name {
        margin: 0;
        min-width: 8.5rem;
        min-height: 1.2em;
        font-weight: 500;
        font-size: 1.05rem;
        line-height: 1.2;
        letter-spacing: 0.01em;
      }

      .alt-figure {
        display: flex;
        align-items: baseline;
        justify-content: center;
        margin: 0.45rem 0 0;
      }

      .alt-value {
        display: block;
        width: 5.35ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        font-size: clamp(3.35rem, 14vw, 8.25rem);
        line-height: 0.9;
        letter-spacing: -0.055em;
      }

      .alt-unit {
        margin-left: 0.28rem;
        font-weight: 500;
        font-size: clamp(1.7rem, 5vw, 2.6rem);
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .alt-note {
        margin: 0.85rem 0 0;
        font-weight: 400;
        font-size: 0.95rem;
        line-height: 1;
        color: rgba(255, 255, 255, 0.78);
      }

      .instrument-peaks {
        position: absolute;
        inset: 0;
      }

      .summit {
        --line: calc(var(--grow, 0) * 7rem);
        position: absolute;
        top: 64%;
        left: var(--x);
        width: 8rem;
        transform: translateX(-50%);
      }

      .summit-line {
        position: absolute;
        left: 50%;
        top: 0;
        width: 1px;
        height: var(--line);
        background: rgba(255, 255, 255, 0.92);
        transform: translate(-50%, -100%);
      }

      .summit-label {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translate(-50%, calc(-100% - 0.55rem - var(--line)));
        opacity: clamp(0, calc((var(--grow, 0) - 0.08) * 1.7), 1);
        text-align: center;
        white-space: nowrap;
      }

      .summit-name,
      .summit-height {
        display: block;
        color: #fff;
      }

      .summit-name {
        font-weight: 500;
        font-size: 0.95rem;
        line-height: 1.15;
      }

      .summit-height {
        margin-top: 0.15rem;
        font-weight: 400;
        font-size: 0.78rem;
        line-height: 1;
        color: rgba(255, 255, 255, 0.82);
      }

      .instrument-sketch,
      .instrument-scale {
        position: absolute;
        inset: 0;
        flex-direction: column;
        align-items: center;
        color: #fff;
      }

      .instrument-sketch {
        justify-content: center;
        padding: 8vh 1.25rem 6vh;
      }

      .instrument-scale {
        justify-content: space-between;
        padding: 9vh 0.75rem 2.5vh;
      }

      .scale-name,
      .scale-figure,
      .scale-value,
      .scale-unit {
        font-family: system-ui, sans-serif;
      }

      .scale-name {
        margin: 0;
        min-height: 1.2em;
        font-weight: 500;
        font-size: 1.05rem;
        line-height: 1.2;
        text-align: center;
      }

      .scale-figure {
        display: flex;
        align-items: baseline;
        justify-content: center;
        margin: 0.25rem 0 0;
      }

      .scale-value {
        display: block;
        width: 5.2ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        font-size: clamp(2.8rem, 11vw, 5rem);
        line-height: 0.9;
        letter-spacing: -0.05em;
      }

      .scale-unit {
        margin-left: 0.28rem;
        font-weight: 500;
        font-size: clamp(1.2rem, 3.4vw, 1.8rem);
        line-height: 1;
      }

      .range-frame {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .range-svg {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
      }

      .sketch-fill {
        fill: #fff;
        stroke: none;
        opacity: clamp(0, calc((var(--p) - 0.78) / 0.22), 1);
      }

      .draw {
        fill: none;
        stroke: #fff;
        stroke-width: 2.15;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 0 1;
        vector-effect: non-scaling-stroke;
      }

      .ruler-track {
        stroke: rgba(255, 255, 255, 0.38);
        stroke-width: 1.5;
      }

      .ruler-fill,
      .vmark line {
        stroke: #fff;
        stroke-width: 1.75;
      }

      .tick {
        stroke: rgba(255, 255, 255, 0.7);
        stroke-width: 1.25;
      }

      .ground {
        stroke: rgba(255, 255, 255, 0.45);
        stroke-width: 1.25;
      }

      .mtn {
        fill: #fff;
        stroke: #3f6fc4;
        stroke-width: 2;
        stroke-linejoin: round;
      }

      .range-svg text {
        fill: #fff;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        font-weight: 500;
      }

      .mint {
        opacity: clamp(0, calc((var(--p) - var(--at)) * 14), 1);
      }

      .dock {
        flex: none;
        padding: 0.75rem 1rem calc(0.8rem + env(safe-area-inset-bottom));
        background: #14356b;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
      }

      .dock-name,
      .dock-blurb {
        margin: 0;
        text-align: center;
      }

      .dock-name {
        font-weight: 500;
        font-size: 0.92rem;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .dock-blurb {
        margin-top: 0.32rem;
        font-weight: 400;
        font-size: 0.75rem;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.66);
      }

      .dock-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.15rem;
        margin-top: 0.65rem;
      }

      .picks {
        display: flex;
        gap: 0.15rem;
      }

      .pick,
      .replay {
        border: 0;
        background: transparent;
      }

      .pick {
        width: 1.85rem;
        height: 1.85rem;
        border-radius: 50%;
        color: rgba(255, 255, 255, 0.72);
        font-family: system-ui, sans-serif;
        font-weight: 500;
        font-size: 0.82rem;
        line-height: 1;
      }

      .pick.is-on {
        background: #fff;
        color: #141414;
      }

      .replay {
        margin-left: 0.45rem;
        padding: 0.45rem 0.15rem 0.45rem 0.85rem;
        border-left: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 0;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-weight: 500;
        font-size: 0.82rem;
        line-height: 1;
      }

      .pick:focus-visible,
      .replay:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-aspect-ratio: 4/5) {
        .home-lock {
          top: max(calc(24px + 12svh), calc(env(safe-area-inset-top) + 0.85rem));
        }

        html[data-screen="sky"]:not(.is-open) .home-lock {
          transform: translateY(calc(40dvh - 12svh));
        }

        .home-mark {
          font-size: 10.5vw;
        }

        .instrument-ruler {
          top: 37%;
          width: min(78vw, 22rem);
        }

        .summit {
          top: 60%;
          --line: calc(var(--grow, 0) * 5.6rem);
        }

        .alt-value {
          font-size: 12.4vw;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cover,
        .home-lock,
        .title-rule,
        .instrument,
        .still {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="lab">
      <div class="stage">
        <picture>
          <source media="(max-aspect-ratio: 4/5)" srcset="../Mobile%20First%20Frame.jpg" />
          <img
            class="still"
            src="../trial-first.jpg"
            alt="A boy holding a ruler up to the sky"
            draggable="false"
          />
        </picture>
        <div class="cover"></div>
        <header class="home-lock">
          <h1 class="home-mark">Galami Labs</h1>
          <div class="title-rule" aria-hidden="true"><span></span></div>
        </header>
        <div class="instrument instrument-ruler" aria-hidden="true">
          <div class="ruler-ticks"></div>
          <div class="ruler-base"><span></span></div>
        </div>
        <div class="instrument instrument-altitude" aria-hidden="true">
          <p class="alt-name">Rigi</p>
          <p class="alt-figure"><span class="alt-value">0</span><span class="alt-unit">m</span></p>
          <p class="alt-note">Altitude</p>
        </div>
        <div class="instrument instrument-peaks" aria-hidden="true">
          <div class="summit" style="--x: 27%">
            <span class="summit-label"><span class="summit-name">Rigi</span><span class="summit-height">1,798 m</span></span>
            <span class="summit-line"></span>
          </div>
          <div class="summit" style="--x: 50%">
            <span class="summit-label"><span class="summit-name">Pilatus</span><span class="summit-height">2,128 m</span></span>
            <span class="summit-line"></span>
          </div>
          <div class="summit" style="--x: 66%">
            <span class="summit-label"><span class="summit-name">Matterhorn</span><span class="summit-height">4,478 m</span></span>
            <span class="summit-line"></span>
          </div>
        </div>
        <div class="instrument instrument-sketch" aria-hidden="true">
          <div class="range-frame">
          <svg class="range-svg sketch-svg" viewBox="70 8 540 532">
            <path class="sketch-fill" d="M96 500 C140 478 162 400 178 348 C188 318.5 198 318.5 208 348 C228 410 258 478 300 500 Z" />
            <path class="sketch-fill" d="M248 500 L272 445 L294 385 L312 418 L348 285.2 L378 358 L398 322 L432 445 L468 500 Z" />
            <path class="sketch-fill" d="M400 500 L445 400 L480 260 L510 145 L530 48 L552 155 L575 310 L598 500 Z" />
            <path class="draw" data-start="0" data-span="0.16" d="M96 500 L598 500" />
            <path class="draw" data-start="0.05" data-span="0.3" d="M96 500 C140 478 162 400 178 348 C188 318.5 198 318.5 208 348 C228 410 258 478 300 500" />
            <path class="draw" data-start="0.26" data-span="0.32" d="M248 500 L272 445 L294 385 L312 418 L348 285.2 L378 358 L398 322 L432 445 L468 500" />
            <path class="draw" data-start="0.5" data-span="0.5" d="M400 500 L445 400 L480 260 L510 145 L530 48 L552 155 L575 310 L598 500" />
          </svg>
          </div>
        </div>
        <div class="instrument instrument-scale" aria-hidden="true">
          <div class="scale-read">
            <p class="scale-name">Rigi</p>
            <p class="scale-figure"><span class="scale-value">0</span><span class="scale-unit">m</span></p>
          </div>
          <div class="range-frame">
          <svg class="range-svg" viewBox="0 0 620 540">
            <line class="ruler-track" x1="36" y1="48" x2="36" y2="500" />
            <line class="ruler-fill" x1="36" y1="500" x2="36" y2="500" />
            <line class="tick" x1="32" y1="449.5" x2="40" y2="449.5" />
            <line class="tick" x1="32" y1="399.1" x2="40" y2="399.1" />
            <line class="tick" x1="32" y1="348.6" x2="40" y2="348.6" />
            <line class="tick" x1="32" y1="298.1" x2="40" y2="298.1" />
            <line class="tick" x1="32" y1="247.7" x2="40" y2="247.7" />
            <line class="tick" x1="32" y1="197.2" x2="40" y2="197.2" />
            <line class="tick" x1="32" y1="146.7" x2="40" y2="146.7" />
            <line class="tick" x1="32" y1="96.3" x2="40" y2="96.3" />
            <line class="tick" x1="28" y1="318.5" x2="48" y2="318.5" />
            <line class="tick" x1="28" y1="285.2" x2="48" y2="285.2" />
            <line class="tick" x1="26" y1="48" x2="50" y2="48" />
            <line class="ground" x1="80" y1="500" x2="604" y2="500" />
            <g class="vmark">
              <line x1="22" y1="48" x2="54" y2="48" />
            </g>
            <clipPath id="rise">
              <rect class="rise-rect" x="0" y="500" width="620" height="0" />
            </clipPath>
            <g clip-path="url(#rise)">
              <path class="mtn" d="M96 500 C140 478 162 400 178 348 C188 318.5 198 318.5 208 348 C228 410 258 478 300 500 Z" />
              <path class="mtn" d="M248 500 L272 445 L294 385 L312 418 L348 285.2 L378 358 L398 322 L432 445 L468 500 Z" />
              <path class="mtn" d="M400 500 L445 400 L480 260 L510 145 L530 48 L552 155 L575 310 L598 500 Z" />
            </g>
            <text class="mint" style="--at: 0.36" x="193" y="304" text-anchor="middle">Rigi</text>
            <text class="mint" style="--at: 0.44" x="348" y="270" text-anchor="middle">Pilatus</text>
            <text class="mint" style="--at: 0.78" x="470" y="78" text-anchor="end">Matterhorn</text>
          </svg>
          </div>
        </div>
        <p class="sr" role="status"></p>
      </div>
      <nav class="dock" aria-label="Loading screens">
        <p class="dock-name">Focus</p>
        <p class="dock-blurb">The first frame sharpens while the animation loads</p>
        <div class="dock-row">
          <div class="picks" role="radiogroup" aria-label="Choose a loading screen">
            <button type="button" class="pick is-on" role="radio" data-v="focus" aria-checked="true" aria-label="Focus">1</button>
            <button type="button" class="pick" role="radio" data-v="sky" aria-checked="false" aria-label="Sky">2</button>
            <button type="button" class="pick" role="radio" data-v="ruler" aria-checked="false" aria-label="Ruler">3</button>
            <button type="button" class="pick" role="radio" data-v="altitude" aria-checked="false" aria-label="Altitude">4</button>
            <button type="button" class="pick" role="radio" data-v="peaks" aria-checked="false" aria-label="Peaks">5</button>
            <button type="button" class="pick" role="radio" data-v="sketch" aria-checked="false" aria-label="Sketch">6</button>
            <button type="button" class="pick" role="radio" data-v="scale" aria-checked="false" aria-label="Scale">7</button>
          </div>
          <button type="button" class="replay">Replay</button>
        </div>
      </nav>
    </div>
    <script>
      const root = document.documentElement;
      const screens = ["focus", "sky", "ruler", "altitude", "peaks", "sketch", "scale"];
      const copy = {
        focus: ["Focus", "The first frame sharpens while the animation loads"],
        sky: ["Sky", "A title card on the sky, then the picture"],
        ruler: ["Ruler", "The measure fills, then the scene appears"],
        altitude: ["Altitude", "A climb through Rigi, Pilatus, and the Matterhorn"],
        peaks: ["Peaks", "The three summit labels draw themselves in"],
        sketch: ["Sketch", "A line draws the three peaks, then fills them in"],
        scale: ["Scale", "A vertical ruler, with each peak at its true height"],
      };
      const peaks = [
        { name: "Rigi", meters: 1798 },
        { name: "Pilatus", meters: 2128 },
        { name: "Matterhorn", meters: 4478 },
      ];
      const bands = [
        [0.02, 0.42],
        [0.28, 0.7],
        [0.55, 1],
      ];
      const summits = [...document.querySelectorAll(".summit")];
      const altName = document.querySelector(".alt-name");
      const altValue = document.querySelector(".alt-value");
      const scaleName = document.querySelector(".scale-name");
      const scaleValue = document.querySelector(".scale-value");
      const scaleFill = document.querySelector(".ruler-fill");
      const scaleMark = document.querySelector(".vmark");
      const riseRect = document.querySelector(".rise-rect");
      const drawPaths = [...document.querySelectorAll(".draw")];
      const rulerTop = 48;
      const rulerBottom = 500;
      const rulerSpan = rulerBottom - rulerTop;
      let drawReady = false;
      const dockName = document.querySelector(".dock-name");
      const dockBlurb = document.querySelector(".dock-blurb");
      const picks = [...document.querySelectorAll(".pick")];
      const status = document.querySelector(".sr");
      const still = document.querySelector(".still");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const duration = 4800;
      let frame = 0;
      let running = false;

      const formatMeters = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

      const curve = (t) => {
        if (t < 0.15) return (t / 0.15) * 0.22;
        if (t < 0.48) return 0.22 + ((t - 0.15) / 0.33) * 0.46;
        if (t < 0.7) return 0.68 + ((t - 0.48) / 0.22) * 0.05;
        const u = (t - 0.7) / 0.3;
        const s = u * u * (3 - 2 * u);
        return 0.73 + s * 0.27;
      };

      const altitudeAt = (p) => {
        if (p >= 1) return { name: peaks[2].name, meters: peaks[2].meters };
        const x = Math.min(0.9999, p) * peaks.length;
        const i = Math.min(peaks.length - 1, Math.floor(x));
        const local = x - i;
        const eased = 1 - (1 - local) ** 3;
        const from = i === 0 ? 0 : peaks[i - 1].meters;
        return { name: peaks[i].name, meters: from + (peaks[i].meters - from) * eased };
      };

      const ensureDraws = () => {
        if (drawReady) return;
        drawPaths.forEach((path) => {
          const len = path.getTotalLength();
          if (!len) return;
          path.dataset.len = String(len);
          path.style.strokeDasharray = `${len}`;
        });
        drawReady = drawPaths.every((path) => Number(path.dataset.len) > 0);
      };

      const setProgress = (amount) => {
        const p = Math.min(1, Math.max(0, amount));
        root.style.setProperty("--p", p.toFixed(4));
        const altitude = altitudeAt(p);
        altName.textContent = altitude.name;
        altValue.textContent = formatMeters(altitude.meters);
        const metersNow = p >= 1 ? 4478 : p * 4478;
        scaleValue.textContent = formatMeters(metersNow);
        scaleName.textContent = metersNow >= 2128 ? "Matterhorn" : metersNow >= 1798 ? "Pilatus" : "Rigi";
        const level = rulerBottom - p * rulerSpan;
        scaleFill.setAttribute("y1", level.toFixed(2));
        scaleMark.setAttribute("transform", `translate(0 ${(level - rulerTop).toFixed(2)})`);
        riseRect.setAttribute("y", level.toFixed(2));
        riseRect.setAttribute("height", (rulerBottom - level).toFixed(2));
        if (root.dataset.screen === "sketch") ensureDraws();
        drawPaths.forEach((path) => {
          const len = Number(path.dataset.len);
          if (!len) return;
          const start = Number(path.dataset.start);
          const span = Number(path.dataset.span);
          const local = Math.min(1, Math.max(0, (p - start) / span));
          path.style.strokeDashoffset = String(len * (1 - local));
        });
        summits.forEach((node, index) => {
          const [start, end] = bands[index];
          const grow = Math.min(1, Math.max(0, (p - start) / (end - start)));
          node.style.setProperty("--grow", grow.toFixed(4));
        });
      };

      const paintChrome = (screen) => {
        const [name, blurb] = copy[screen];
        dockName.textContent = name;
        dockBlurb.textContent = blurb;
        picks.forEach((button) => {
          const on = button.dataset.v === screen;
          button.classList.toggle("is-on", on);
          button.setAttribute("aria-checked", on ? "true" : "false");
        });
      };

      const finish = () => {
        running = false;
        setProgress(1);
        root.classList.add("is-open");
        status.textContent = "Ready";
      };

      const tick = (now) => {
        if (!running) return;
        const t = Math.min(1, (now - tick.started) / duration);
        setProgress(curve(t));
        if (t < 1) {
          frame = requestAnimationFrame(tick);
          return;
        }
        finish();
      };

      const play = () => {
        cancelAnimationFrame(frame);
        running = false;
        root.classList.remove("is-open");
        setProgress(0);
        status.textContent = "Loading Galami Labs";
        if (reduceMotion.matches) {
          finish();
          return;
        }
        running = true;
        tick.started = performance.now();
        frame = requestAnimationFrame(tick);
      };

      const select = (screen, options = {}) => {
        const next = screens.includes(screen) ? screen : "focus";
        root.dataset.screen = next;
        paintChrome(next);
        const url = new URL(location.href);
        url.searchParams.set("v", next);
        url.searchParams.delete("at");
        history.replaceState(null, "", url);
        if (options.hold !== undefined) {
          cancelAnimationFrame(frame);
          running = false;
          root.classList.toggle("is-open", options.hold >= 1);
          setProgress(options.hold);
          status.textContent = options.hold >= 1 ? "Ready" : "Loading Galami Labs";
          return;
        }
        play();
      };

      picks.forEach((button) => {
        button.addEventListener("click", () => select(button.dataset.v));
      });
      document.querySelector(".replay").addEventListener("click", play);
      window.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const current = screens.indexOf(root.dataset.screen);
        if (event.key === "ArrowRight") {
          select(screens[(current + 1) % screens.length]);
        } else if (event.key === "ArrowLeft") {
          select(screens[(current - 1 + screens.length) % screens.length]);
        } else if (event.key === "r" || event.key === "R") {
          play();
        }
      });

      const params = new URLSearchParams(location.search);
      const held = params.has("at") ? Number(params.get("at")) : NaN;
      const boot = () => {
        if (Number.isFinite(held)) select(root.dataset.screen, { hold: Math.min(1, Math.max(0, held)) });
        else select(root.dataset.screen);
      };
      const decoded = still.decode ? still.decode().then(() => {}, () => {}) : Promise.resolve();
      const waited = new Promise((resolve) => {
        if (still.complete) resolve();
        else still.addEventListener("load", resolve, { once: true });
      });
      Promise.race([
        Promise.all([decoded, waited]),
        new Promise((resolve) => setTimeout(resolve, 1800)),
      ]).then(boot);
    </script>
  </body>
</html>
