<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3f6fc4" />
    <title>Galami Labs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scrub">
      <div class="pin">
        <img
          src="First Frame.jpg"
          alt="A boy holding a ruler up to the sky"
          fetchpriority="high"
          decoding="sync"
          draggable="false"
        />
        <video
          class="hero-video"
          muted
          playsinline
          webkit-playsinline
          preload="none"
          disablepictureinpicture
          disableremoteplayback
          poster="First Frame.jpg"
        ></video>
      </div>
    </main>
    <script src="scrub.js"></script>
  </body>
</html>
